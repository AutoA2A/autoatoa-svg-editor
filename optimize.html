<sectionclass="container" style="margin-bottom:16px;"><h2>SVG 优化</h2>
<textarea id="svgInput" rows="10" placeholder="粘贴或输入 SVG 代码..." style="width:100%;box-sizing:border-box;"></textarea>
<div style="margin-top:8px;">
<button style="background-color:#2ecc71;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;" id="optimizeBtn">优化</button>
<button style="background-color:#2ecc71;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;margin-left:8px;" id="copyBtn">复制结果</button>
</div>
<textarea id="svgOutput" rows="10" placeholder="优化后的 SVG 代码..." style="width:100%;box-sizing:border-box;margin-top:8px;" readonly></textarea>
</section>
<script>
document.getElementById('optimizeBtn').addEventListener('click', () => {
    const input = document.getElementById('svgInput').value;
    if (!input.trim()) {
        alert('请先输入 SVG 代码');
        return;
    }
    let optimized = optimizeSVG(input);
    document.getElementById('svgOutput').value = optimized;
});
document.getElementById('copyBtn').addEventListener('click', () => {
    const output = document.getElementById('svgOutput');
    output.select();
    document.execCommand('copy');
    alert('已复制到剪贴板');
});
function optimizeSVG(svg) {
    // 1. 移除注释
    let s = svg.replace(/<!--[\s\S]*?-->/g, '');
    // 2. 移除标签之间的空白
    s = s.replace(/>\s*</g, '><');
    // 3. 移除标签内多余空白并保留单个空格
    s = s.replace(/<\/?[\w:-]+[^>]*>/g, tag => {
        return tag.replace(/\s+/g, ' ').trim();
    });
    // 4. 移除空属性
    s = s.replace(/\s+\w+=""/g, '');
    // 5. 移除末尾空格 перед闭合符号
    s = s.replace(/\s+\/>/g, '/>');
    // 6. 移除 XML 声明中的版本信息（如果不是必需）
    s = s.replace(/<\?xml[^>]*\?>\s*/, '');
    return s;
}
</script>
