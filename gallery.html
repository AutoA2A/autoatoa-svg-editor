<section>
    <h2>我的作品</h2>
    <div id="gallery" style="display:flex; flex-wrap:wrap; gap:16px; justify-content:center;"></div>
    <div id="emptyMsg" style="text-align:center; padding:16px;"><p>暂无作品，快去 <a href="index.html">编辑器</a> 创作吧！</p></div>
</section>

<script>
    const STORAGE_KEY = 'svgWorks';

    function getWorks() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveWorks(works) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    }

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        const emptyMsg = document.getElementById('emptyMsg');
        const works = getWorks();
        gallery.innerHTML = '';
        if (works.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        works.forEach(w => {
            const card = document.createElement('article');
            card.className = 'container';
            card.style.marginBottom = '16px';
            card.innerHTML = `
                <h2>${w.title || '未命名作品'}</h2>
                <p style="display:flex; flex-direction:column; gap:8px;">
                    <div style="text-align:center;">
                        <!-- 预览 SVG，限制高度 -->
                        <div style="width:260px; height:180px; overflow:hidden; border:1px solid #ddd;">
                            ${w.svg}
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="load" style="background:#3498db;color:#fff;border:none;padding:6px 0;border-radius:4px;cursor:pointer;flex:1;">加载编辑</button>
                        <button class="del" style="background:#e74c3c;color:#fff;border:none;padding:6px 0;border-radius:4px;cursor:pointer:1;">删除</button>
                    </div>
                </p>
            `;
            const loadBtn = card.querySelector('.load');
            const delBtn = card.querySelector('.del');
            loadBtn.onclick = () => {
                // 传递作品 ID 过去编辑页
                location.href = `index.html?id=${w.id}`;
            };
            delBtn.onclick = () => {
                const updated = getWorks().filter(item => item.id !== w.id);
                saveWorks(updated);
                renderGallery();
            };
            gallery.appendChild(card);
        });
    }

    // 初始化渲染
    renderGallery();
</script>
