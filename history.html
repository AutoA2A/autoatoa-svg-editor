<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>编辑历史</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
    --primary:#2563eb;
    --secondary:#10b981;
    --bg:#fff;
    --muted:#f9fafb;
    --text:#1f2937;
    --radius:8px;
    --btn-radius:6px;
    --unit:16px;
}
*, *::before, *::after{box-sizing:border-box;}
html{font-size:100%;}
body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f9fafb;
    color:var(--text);
    line-height:1.5;
}
header{
    background:var(--bg);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    padding:calc(var(--unit)*0.5) 0;
}
nav{
    display:flex;
    gap:calc(var(--unit)*0.5);
    overflow-x:auto;
    padding:0 calc(var(--unit)*0.5);
    scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none;}
nav a{
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--muted);
    padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);
    border-radius:var(--btn-radius);
    white-space:nowrap;
    transition:background .2s, color .2s;
}
nav a:hover{
    background:#e0e7ff;
    color:var(--primary);
}
main{
    max-width:1200px;
    margin:0 auto;
    padding:calc(var(--unit)*2);
}
</style>

<main>

<section class="section">
  <h2 class="section-title">编辑历史</h2>
  <div class="section-content">
    <div id="history-controls" style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
      <button id="undoBtn" class="btn btn-primary">撤销</button>
      <button id="redoBtn" class="btn btn-primary">重做</button>
      <button id="clearBtn" class="btn btn-primary">清除历史</button>
    </div>
    <div id="history-list" style="max-height:400px; overflow-y:auto; border:1px solid var(--muted); border-radius:var(--radius); padding:0.5rem;"></div>
  </div>
</section>

<script>
(function () {
  const STORAGE_KEY = 'svgEditorHistory';
  const INDEX_KEY   = 'svgEditorHistoryIndex';

  function loadState() {
    const historyRaw = localStorage.getItem(STORAGE_KEY);
    const indexRaw   = localStorage.getItem(INDEX_KEY);
    const history = historyRaw ? JSON.parse(historyRaw) : [];
    const index   = indexRaw !== null ? JSON.parse(indexRaw) : -1;
    return {history, index};
  }

  function saveState(history, index) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    localStorage.setItem(INDEX_KEY,   JSON.stringify(index));
  }

  function svgToDataUrl(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function renderList() {
    const {history, index} = loadState();
    const container = document.getElementById('history-list');
    container.innerHTML = '';
    history.forEach((svg, i) => {
      const item = document.createElement('div');
      item.style.display = 'flex';
      item.style.alignItems = 'center';
      item.style.gap = '0.5rem';
      item.style.padding = '0.25rem';
      item.style.borderBottom = i === history.length - 1 ? 'none' : '1px solid var(--muted)';

      const preview = document.createElement('img');
      preview.src = svgToDataUrl(svg);
      preview.style.width = '60px';
      preview.style.height = '60px';
      preview.style.objectFit = 'contain';
      preview.style.borderRadius = 'var(--radius)';
      preview.style.background = 'var(--muted)';

      const info = document.createElement('div');
      info.style.flex = '1';
      info.style.minWidth = '0';
      const title = document.createElement('div');
      title.textContent = `步骤 ${i + 1}`;
      title.style.fontWeight = '500';
      const btn = document.createElement('button');
      btn.textContent = '恢复到此状态';
      btn.className = 'btn btn-primary';
      btn.style.fontSize = '0.875rem';
      btn.style.padding = 'calc(var(--unit)*0.2) calc(var(--unit)*0.4)';
      btn.onclick = () => {
        const {history, index: curIdx} = loadState();
        if (i !== curIdx) {
          saveState(history, i);
          // Notify editor (index.html) via storage event
          window.dispatchEvent(new Event('storage'));
        }
      };
      info.append(title, btn);
      item.append(preview, info);
      container.appendChild(item);
    });
  }

  document.getElementById('undoBtn').onclick = () => {
    const {history, index} = loadState();
    if (index > 0) {
      saveState(history, index - 1);
      window.dispatchEvent(new Event('storage'));
    }
  };

  document.getElementById('redoBtn').onclick = () => {
    const {history, index} = loadState();
    if (index < history.length - 1) {
      saveState(history, index + 1);
      window.dispatchEvent(new Event('storage'));
    }
  };

  document.getElementById('clearBtn').onclick = () => {
    saveState([], -1);
    window.dispatchEvent(new Event('storage'));
  };

  // Initial render
  renderList();

  // Update if another tab changes storage (optional)
  window.addEventListener('storage', renderList);
})();
</script>

</main>
