<section class="container" style="margin-bottom:16px;"><h2>上传模板</h2><p><input type="file" id="svgUpload" accept=".svg" style="padding:6px;border:1px solid #ccc;border-radius:4px;"><input type="text" id="templateName" placeholder="模板名称" style="padding:6px;border:1px solid #ccc;border-radius:4px;min-width:120px;"><input type="text" id="templateCategory" placeholder="分类（可选）" style="padding:6px;border:1px solid #ccc;border-radius:4px;min-width:120px;"><button id="uploadBtn" style="background:#3498db;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">上传模板</button></p></section>
<section class="container" style="margin-bottom:16px;"><h2>过滤</h2><p><input type="text" id="categoryFilter" placeholder="按分类过滤" style="padding:6px;border:1px solid #ccc;border-radius:4px;min-width:140px;"><button id="clearFilterBtn" style="background:#3498db;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">清除过滤</button></p></section>
<div id="templatesGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
  <div style="background-color: #f9f9f9; padding: 16px; border-radius: 4px;">网格项 1</div>
  <div style="background-color: #f9f9f9; padding: 16px; border-radius: 4px;">网格项 2</div>
  <div style="background-color: #f9f9f9; padding: 16px; border-radius: 4px;">网格项 3</div>
</div>
<div id="emptyPlaceholder" style="display:none;text-align:center;padding:16px;"><p>暂无数据</p></div>
<script>
  let templates = JSON.parse(localStorage.getItem('svgTemplates')||'[]');
  const uploadBtn = document.getElementById('uploadBtn');
  const svgUpload = document.getElementById('svgUpload');
  const templateName = document.getElementById('templateName');
  const templateCategory = document.getElementById('templateCategory');
  const categoryFilter = document.getElementById('categoryFilter');
  const clearFilterBtn = document.getElementById('clearFilterBtn');
  const templatesGrid = document.getElementById('templatesGrid');
  const emptyPlaceholder = document.getElementById('emptyPlaceholder');
  function save(){localStorage.setItem('svgTemplates',JSON.stringify(templates));}
  function render(){
    const f = categoryFilter.value.trim().toLowerCase();
    const filtered = templates.filter(t=>!f || t.category.toLowerCase().includes(f));
    if(filtered.length===0){
      templatesGrid.style.display='none';
      emptyPlaceholder.style.display='block';
    }else{
      templatesGrid.style.display='grid';
      emptyPlaceholder.style.display='none';
      const slots = templatesGrid.children;
      for(let i=0;i<slots.length;i++){
        if(i<filtered.length){
          const t = filtered[i];
          slots[i].innerHTML = `<div style="text-align:center;"><strong>${t.name||'未命名'}</strong><br/><small>分类：${t.category||'无'}</small></div>`;
        }else{
          slots[i].innerHTML='';
        }
      }
    }
  }
  uploadBtn.onclick=()=>{
    const file = svgUpload.files[0];
    if(!file){alert('请选择SVG文件');return;}
    const name = templateName.value.trim()||'未命名模板';
    const category = templateCategory.value.trim()||'未分类';
    const r = new FileReader();
    r.onload=e=>{
      templates.push({id:Date.now(),name,category,svg:e.target.result});
      save();
      render();
      svgUpload.value='';
      templateName.value='';
      templateCategory.value='';
    };
    r.readAsText(file);
  };
  clearFilterBtn.onclick=()=>{categoryFilter.value='';render();};
  categoryFilter.oninput=render;
  render();
</script>
