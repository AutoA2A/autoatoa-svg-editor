<divclass="container">
    <h1>导出与分享</h1>

    <div>
        <label for="format-select">导出格式</label>
        <select id="format-select">
            <option value="svg">SVG (矢量)</option>
            <option value="png">PNG (位图)</option>
            <option value="jpeg">JPEG (位图)</option>
        </select>

        <label for="scale-input">分辨率倍数（仅对 PNG/JPEG 有效）</label>
        <input type="number" id="scale-input" min="1" max="5" value="2" step="0.5">
        <p class="note">例如 2 表示导出图片为原始 SVG 尺寸的 2 倍。</p>

        <div class="button-group">
            <button id="download-btn">一键下载</button>
            <button id="share-btn" class="secondary">生成分享链接</button>
            <button id="copy-link-btn" class="secondary">复制链接</button>
        </div>

        <div id="preview" style="margin-top:1.5rem; text-align:center; color:#555; min-height:120px; display:flex; align-items:center; justify-content:center;">
            <!-- 预览图片或 SVG 将在此显示 -->
        </div>
        <div id="share-link" style="display:none; margin-top:0.8rem; word-break:break-all; font-family:monospace; background:#f3f4f6; padding:0.4rem 0.6rem; border-radius:4px;"></div>
    </div>
</div>

<style>
    /* 复用母版配色与字体 */
    body {
        font-family: 'Open Sans', Arial, sans-serif;
        background:#f9f9f9;
        color:#111;
        margin:0;
    }
    .container {
        max-width:960px;
        margin:20px auto;
        padding:16px;
    }
    h1 {
        color:#2ecc71;
        text-align:center;
        margin-top:0;
        margin-bottom:1.5rem;
    }
    label {
        display:block;
        margin-top:0.8rem;
        font-size:0.95rem;
        color:#333;
    }
    select, input[type=number] {
        width:100%;
        padding:0.5rem;
        margin-top:0.3rem;
        border:1px solid #3498db;
        border-radius:4px;
        background:#fff;
        font-size:0.9rem;
    }
    .button-group {
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        margin-top:1.2rem;
    }
    button {
        flex:1 1 150px;
        min-width:120px;
        padding:0.6rem 1rem;
        font-size:0.95rem;
        background:#3498db;
        color:#fff;
        border:none;
        border-radius:4px;
        cursor:pointer;
        transition:background .2s;
    }
    button:hover {
        background:#2980b9;
    }
    button.secondary {
        background:#2ecc71;
    }
    button.secondary:hover {
        background:#27ae60;
    }
    #preview img, #preview svg {
        max-width:100%;
        height:auto;
        border:1px dashed #3498db;
        border-radius:4px;
    }
    #share-link {
        word-break:break-all;
        font-family:monospace;
        background:#f3f4f6;
        padding:0.4rem 0.6rem;
        border-radius:4px;
        display:inline-block;
        margin-top:0.6rem;
    }
    .note {
        font-size:0.85rem;
        color:#666;
        margin-top:0.8rem;
    }
    @media (max-width:480px){
        .button-group{flex-direction:column;}
        button{flex:1 1 auto;}
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const formatSelect = document.getElementById('format-select');
    const scaleInput   = document.getElementById('scale-input');
    const downloadBtn  = document.getElementById('download-btn');
    const shareBtn     = document.getElementById('share-btn');
    const copyLinkBtn  = document.getElementById('copy-link-btn');
    const previewArea  = document.getElementById('preview');
    const shareLinkDiv = document.getElementById('share-link');

    // 从编辑器保存的 SVG 中读取（假设编辑器在 index.html 中保存到 localStorage）
    function getSvgString() {
        const saved = localStorage.getItem('svgContent');
        if (saved) return saved;
        // 默认示例 SVG，确保页面有内容可演示
        return `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">
            <rect width="100%" height="100%" fill="#f9f9f9"/>
            <circle cx="200" cy="150" r="80" fill="#3498db"/>
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-size="24">SVG 示例</text>
        </svg>`;
    }

    // 将 SVG 字符串转为 Blob URL（用于预览和绘制）
    function svgToBlobUrl(svgStr) {
        const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
        return URL.createObjectURL(blob);
    }

    // 更新预览
    function updatePreview() {
        const svgStr = getSvgString();
        const url = svgToBlobUrl(svgStr);
        // 清除之前的对象 URL
        if (previewArea.dataset.prevUrl) {
            URL.revokeObjectURL(previewArea.dataset.prevUrl);
        }
        previewArea.innerHTML = '';
        if (formatSelect.value === 'svg') {
            const img = document.createElement('img');
            img.src = url;
            img.style.maxWidth = '100%';
            previewArea.appendChild(img);
        } else {
            // 对于位图预览，使用 1x 尺寸的 PNG
            const img = document.createElement('img');
            img.src = url;
            img.onload = () => URL.revokeObjectURL(url);
            img.style.maxWidth = '100%';
            previewArea.appendChild(img);
        }
        previewArea.dataset.prevUrl = url;
    }

    formatSelect.addEventListener('change', updatePreview);
    scaleInput.addEventListener('input', updatePreview);
    updatePreview();

    // 下载功能
    downloadBtn.addEventListener('click', () => {
        const svgStr = getSvgString();
        const scale = parseFloat(scaleInput.value);
        const blobUrl = svgToBlobUrl(svgStr);

        if (formatSelect.value === 'svg') {
            const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'export.svg';
            a.click();
            URL.revokeObjectURL(url);
        } else {
            const img = new Image();
            img.src = blobUrl;
            img.onload = () => {
                // 计算画布尺寸
                const width = img.width * scale;
                const height = img.height * scale;
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                // 若需要透明背景，则清空；否则填白底
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                const mime = formatSelect.value === 'jpeg' ? 'image/jpeg' : 'image/png';
                const quality = formatSelect.value === 'jpeg' ? 0.92 : undefined;
                const dataUrl = canvas.toDataURL(mime, quality);
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `export.${formatSelect.value}`;
                a.click();
                // 释放对象 URL
                URL.revokeObjectURL(blobUrl);
            };
            img.onerror = () => {
                alert('SVG 加载失败，请检查内容。');
                URL.revokeObjectURL(blobUrl);
            };
        }
    });

    // 生成分享链接（Data URL）
    shareBtn.addEventListener('click', () => {
        const svgStr = getSvgString();
        const scale = parseFloat(scaleInput.value);
        const blobUrl = svgToBlobUrl(svgStr);

        if (formatSelect.value === 'svg') {
            const encoded = btoa(unescape(encodeURIComponent(svgStr)));
            const shareUrl = `data:image/svg+xml;base64,${encoded}`;
            shareLinkDiv.textContent = shareUrl;
            shareLinkDiv.style.display = 'block';
            URL.revokeObjectURL(blobUrl);
        } else {
            const img = new Image();
            img.src = blobUrl;
            img.onload = () => {
                const width = img.width * scale;
                const height = img.height * scale;
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                const mime = formatSelect.value === 'jpeg' ? 'image/jpeg' : 'image/png';
                const quality = formatSelect.value === 'jpeg' ? 0.92 : undefined;
                const dataUrl = canvas.toDataURL(mime, quality);
                shareLinkDiv.textContent = dataUrl;
                shareLinkDiv.style.display = 'block';
                URL.revokeObjectURL(blobUrl);
            };
            img.onerror = () => {
                alert('SVG 加载失败。');
                URL.revokeObjectURL(blobUrl);
            };
        }
    });

    // 复制链接到剪贴板
    copyLinkBtn.addEventListener('click', () => {
        const text = shareLinkDiv.textContent;
        if (!text) {
            alert('请先生成分享链接。');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            alert('链接已复制到剪贴板');
        }).catch(err => {
            alert('复制失败：' + err);
        });
    });
});
</script>
