<script>
(() => {
    const NS = "http://www.w3.org/2000/svg";
    const drawing = document.getElementById('drawing');
    const statusEl = document.getElementById('status');
    const propContainer = document.getElementById('prop-container');
    const noSelection = document.getElementById('no-selection');
    const propFill = document.getElementById('prop-fill');
    const propStroke = document.getElementById('prop-stroke');
    const propWidth = document.getElementById('prop-width');
    const widthValue = document.getElementById('width-value');

    let selectedTool = 'select';
    let selectedElement = null;
    let startX = 0, startY = 0;
    let previewEl = null;
    const history = [];
    const future = [];
    const HISTORY_LIMIT = 50;

    // ---- UI helpers ----
    function setStatus(msg){ statusEl.textContent = msg; }
    function setTool(tool){
        selectedTool = tool;
        document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('active'));
        const btn = document.getElementById(`tool-${tool}`);
        if (btn) btn.classList.add('active');
        setStatus(`当前工具：${toolNames[tool]||tool}`);
    }
    const toolNames = {select:'选择', rect:'矩形', circle:'圆形', line:'直线', pen:'笔刷'};

    // ---- History ----
    function saveState(){
        const state = drawing.outerHTML;
        history.push(state);
        if (history.length > HISTORY_LIMIT) history.shift();
        future.length = 0;
        localStorage.setItem('svgEditorContent', drawing.innerHTML);
    }
    function undo(){
        if (history.length===0) return;
        future.push(drawing.outerHTML);
        const prev = history.pop();
        drawing.outerHTML = prev;
        setStatus('已撤销');
    }
    function redo(){
        if (future.length===0) return;
        history.push(drawing.outerHTML);
        const next = future.pop();
        drawing.outerHTML = next;
        setStatus('已重做');
    }
    function clearCanvas(){
        if (!confirm('确定要清空画布吗？')) return;
        drawing.innerHTML = '';
        saveState();
        selectElement(null);
    }
    function loadLocal(){
        const data = localStorage.getItem('svgEditorContent');
        if (data){
            drawing.innerHTML = data;
            saveState(); // initialize history
            setStatus('已读取本地内容');
        } else {
            setStatus('本地暂无保存内容');
        }
    }
    function saveLocal(){
        localStorage.setItem('svgEditorContent', drawing.innerHTML);
        setStatus('已保存到本地');
    }

    // ---- Selection ----
    function selectElement(el){
        if (selectedElement) {
            selectedElement.classList.remove('selected');
        }
        selectedElement = el;
        if (selectedElement) {
            selectedElement.classList.add('selected');
            propContainer.classList.remove('hidden');
            noSelection.classList.add('hidden');
            // populate inputs
            propFill.value = selectedElement.getAttribute('fill') || '#ffffff';
            propStroke.value = selectedElement.getAttribute('stroke') || '#000000';
            const width = selectedElement.getAttribute('stroke-width') || '1';
            propWidth.value = width;
            widthValue.textContent = width;
        } else {
            propContainer.classList.add('hidden');
            noSelection.classList.remove('hidden');
        }
    }

    // ---- Drawing helpers ----
    function createPreviewElement(type){
        const el = document.createElementNS(NS, type);
        el.setAttribute('fill', 'none');
        el.setAttribute('stroke', propStroke.value);
        el.setAttribute('stroke-width', propWidth.value);
        el.setAttribute('pointer-events', 'none');
        return el;
    }
    function updatePreview(){
        if (!previewEl) return;
        const x = Math.min(startX, dragX), y = Math.min(startY, dragY);
        const w = Math.abs(dragX - startX), h = Math.abs(dragY - startY);
        switch (selectedTool){
            case 'rect':
                previewEl.setAttribute('x', x);
                previewEl.setAttribute('y', y);
                previewEl.setAttribute('width', w);
                previewEl.setAttribute('height', h);
                break;
            case 'circle':
                const radius = Math.sqrt(w*w + h*h);
                previewEl.setAttribute('cx', startX);
                previewEl.setAttribute('cy', startY);
                previewEl.setAttribute('r', radius);
                break;
            case 'line':
                previewEl.setAttribute('x1', startX);
                previewEl.setAttribute('y1', startY);
                previewEl.setAttribute('x2', dragX);
                previewEl.setAttribute('y2', dragY);
                break;
        }
    }
    function finalizeShape(){
        if (!previewEl) return;
        const copy = previewEl.cloneNode(true);
        drawing.appendChild(copy);
        previewEl.remove();
        previewEl = null;
        selectElement(copy); // auto-select new shape
        saveState();
    }

    // ---- Mouse handling ----
    let dragX = 0, dragY = 0;
    function onMouseDown(e){
        if (e.target !== drawing) return; // ignore clicks on existing shapes for drawing
        startX = e.offsetX; startY = e.offsetY;
        dragX = startX; dragY = startY;
        if (selectedTool === 'select'){
            // clicking empty area -> deselect
            selectElement(null);
            return;
        }
        if (selectedTool === 'pen'){
            const polyline = document.createElementNS(NS, 'polyline');
            polyline.setAttribute('fill', 'none');
            polyline.setAttribute('stroke', propStroke.value);
            polyline.setAttribute('stroke-width', propWidth.value);
            polyline.setAttribute('points', `${startX},${startY}`);
            drawing.appendChild(polyline);
            previewEl = polyline;
            return;
        }
        // shape preview
        previewEl = createPreviewElement(
            selectedTool === 'rect' ? 'rect' :
            selectedTool === 'circle' ? 'circle' : 'line'
        );
        drawing.appendChild(previewEl);
        updatePreview();
    }
    function onMouseMove(e){
        if (!previewEl) return;
        dragX = e.offsetX; dragY = e.offsetY;
        if (selectedTool === 'pen'){
            const points = previewEl.getAttribute('points');
            previewEl.setAttribute('points', points + ` ${dragX},${dragY}`);
        } else {
            updatePreview();
        }
    }
    function onMouseUp(e){
        if (!previewEl) return;
        if (selectedTool === 'pen'){
            // finalize polyline
            saveState();
            selectElement(previewEl);
            previewEl = null;
        } else if (selectedTool !== 'select'){
            finalizeShape();
        }
    }
    function onCanvasClick(e){
        // handle selection of existing shapes
        if (e.target === drawing) {
            selectElement(null);
            return;
        }
        const el = e.target;
        if (el.tagName && el.tagName.toUpperCase() !== 'SVG'){
            selectElement(el);
        }
    }

    // ---- Property updates ----
    function applyPropertyToSelected(name, value){
        if (!selectedElement) return;
        selectedElement.setAttribute(name, value);
        saveState();
    }
    propFill.addEventListener('input', ()=> applyPropertyToSelected('fill', propFill.value));
    propStroke.addEventListener('input', ()=> {
        applyPropertyToSelected('stroke', propStroke.value);
        if (previewEl) previewEl.setAttribute('stroke', propStroke.value);
    });
    propWidth.addEventListener('input', ()=> {
        const val = propWidth.value;
        widthValue.textContent = val;
        applyPropertyToSelected('stroke-width', val);
        if (previewEl) previewEl.setAttribute('stroke-width', val);
    });

    // ---- Toolbar button listeners ----
    document.getElementById('tool-select').addEventListener('click',()=>setTool('select'));
    document.getElementById('tool-rect').addEventListener('click',()=>setTool('rect'));
    document.getElementById('tool-circle').addEventListener('click',()=>setTool('circle'));
    document.getElementById('tool-line').addEventListener('click',()=>setTool('line'));
    document.getElementById('tool-pen').addEventListener('click',()=>setTool('pen'));
    document.getElementById('undo').addEventListener('click', undo);
    document.getElementById('redo').addEventListener('click', redo);
    document.getElementById('clear').addEventListener('click', clearCanvas);
    document.getElementById('save').addEventListener('click', saveLocal);
    document.getElementById('load').addEventListener('click', loadLocal);

    // ---- Keyboard shortcuts ----
    window.addEventListener('keydown', e=>{
        if (e.ctrlKey){
            if (e.key === 'z' || e.key === 'Z'){ e.preventDefault(); undo(); }
            if (e.key === 'y' || e.key === 'Y'){ e.preventDefault(); redo(); }
        }
    });

    // ---- Initialize ----
    drawing.addEventListener('mousedown', onMouseDown);
    drawing.addEventListener('mousemove', onMouseMove);
    drawing.addEventListener('mouseup', onMouseUp);
    drawing.addEventListener('click', onCanvasClick);
    // style for selected element
    const style = document.createElement('style');
    style.textContent = `
        .selected { filter: drop-shadow(0 0 2px var(--secondary)); }
    `;
    document.head.appendChild(style);
    // load existing content
    loadLocal();
    // set default tool
    setTool('select');
})();
</script>
