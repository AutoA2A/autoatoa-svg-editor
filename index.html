<divstyle="display:flex; gap:16px;">
  <aside id="toolbar" style="width:200px; background:#f0f0f0; padding:12px; border-radius:4px;">

  <aside id="props" style="width:260px; background:#f0f0f0; padding:12px; border-radius:4px;">

      <label style="display:block;margin-bottom:8px;">填充色 <input type="color" id="prop-fill" value="#ffffff"></label>
      <label style="display:block;margin-bottom:8px;">描边色 <input type="color" id="prop-stroke" value="#000000"></label>
      <label style="display:block;margin-bottom:8px;">描边宽度

<script>
(function(){
  const svg = document.getElementById('drawing');
  const status = document.getElementById('status');
  const tools = {
    select: document.getElementById('tool-select'),
    rect:   document.getElementById('tool-rect'),
    circle: document.getElementById('tool-circle'),
    line:   document.getElementById('tool-line'),
    pen:    document.getElementById('tool-pen')
  };
  const undoBtn = document.getElementById('btn-undo');
  const redoBtn = document.getElementById('btn-redo');
  const clearBtn = document.getElementById('btn-clear');
  const saveBtn = document.getElementById('btn-save');
  const loadBtn = document.getElementById('btn-load');
  const propFill = document.getElementById('prop-fill');
  const propStroke = document.getElementById('prop-stroke');
  const propWidth = document.getElementById('prop-width');
  const widthValue = document.getElementById('width-value');
  const noSelection = document.getElementById('no-selection');
  const selectionProps = document.getElementById('selection-props');

  let currentTool = 'select';
  let isDrawing = false;
  let startX, startY;
  let selectedElement = null;
  const history = [];
  let historyIndex = -1;

  function setStatus(msg){ status.textContent = msg; }
  function saveState(){ history.push(svg.innerHTML); historyIndex++; redoBtn.disabled = true; undoBtn.disabled = historyIndex===0; }
  function undo(){
    if(historyIndex>0){ historyIndex--; svg.innerHTML = history[historyIndex]; updateBtns(); }
  }
  function redo(){
    if(historyIndex<history.length-1){ historyIndex++; svg.innerHTML = history[historyIndex]; updateBtns(); }
  }
  function updateBtns(){ undoBtn.disabled = historyIndex===0; redoBtn.disabled = historyIndex===history.length-1; }
  function clear(){ svg.innerHTML=''; history.length=0; historyIndex=-1; updateBtns(); setStatus('画布已清空'); }
  function save(){ try{ localStorage.setItem('svgEditor', svg.innerHTML); setStatus('已保存到本地'); }catch(e){ setStatus('保存失败'); } }
  function load(){ const data = localStorage.getItem('svgEditor'); if(data){ svg.innerHTML=data; history.length=0; historyIndex=-1; updateBtns(); setStatus('已从本地加载'); }else{ setStatus('本地无数据'); } }

  function activateTool(tool){
    Object.values(tools).forEach(b=>b.style.background='#2ecc71');
    tools[tool].style.background='#27ae60';
    currentTool = tool;
  }
  function selectElement(evt){
    const target = evt.target;
    if(target===svg || !target.tagName||target.tagName.toLowerCase()!=='svg'){ selectedElement = target; }
    else{ selectedElement = null; }
    if(selectedElement){
      noSelection.style.display='none';
      selectionProps.style.display='block';
      propFill.value = selectedElement.getAttribute('fill')||'#ffffff';
      propStroke.value = selectedElement.getAttribute('stroke')||'#000000';
      propWidth.value = selectedElement.getAttribute('stroke-width')||2;
      widthValue.textContent = propWidth.value;
    }else{
      noSelection.style.display='block';
      selectionProps.style.display='none';
    }
  }
  function startDraw(evt){
    isDrawing = true;
    startX = evt.offsetX; startY = evt.offsetY;
  }
  function endDraw(evt){
    if(!isDrawing) return;
    isDrawing = false;
    const endX = evt.offsetX, endY = evt.offsetY;
    let elem;
    switch(currentTool){
      case 'rect':
        const w = Math.abs(endX-startX), h = Math.abs(endY-startY);
        elem = document.createElementNS('http://www.w3.org/2000/svg','rect');
        elem.setAttribute('x', Math.min(startX,endX));
        elem.setAttribute('y', Math.min(startY,endY));
        elem.setAttribute('width', w);
        elem.setAttribute('height', h);
        break;
      case 'circle':
        const r = Math.sqrt(Math.pow(endX-startX,2)+Math.pow(endY-startY,2));
        elem = document.createElementNS('http://www.w3.org/2000/svg','circle');
        elem.setAttribute('cx', startX);
        elem.setAttribute('cy', startY);
        elem.setAttribute('r', r);
        break;
      case 'line':
        elem = document.createElementNS('http://www.w3.org/2000/svg','line');
        elem.setAttribute('x1', startX);
        elem.setAttribute('y1', startY);
        elem.setAttribute('x2', endX);
        elem.setAttribute('y2', endY);
        break;
      case 'pen':
        // simple freehand: create a polyline with two points (will be extended on move)
        elem = document.createElementNS('http://www.w3.org/2000/svg','polyline');
        elem.setAttribute('points', `${startX},${startY} ${endX},${endY}`);
        break;
    }
    if(elem){
      elem.setAttribute('fill', propFill.value);
      elem.setAttribute('stroke', propStroke.value);
      elem.setAttribute('stroke-width', propWidth.value);
      elem.setAttribute('style', 'cursor:move;');
      svg.appendChild(elem);
      selectedElement = elem;
      selectElement({target:elem});
      saveState();
    }
  }
  function onMove(evt){
    if(!isDrawing) return;
    if(currentTool==='pen'){
      const polyline = selectedElement;
      const points = polyline.getAttribute('points');
      polyline.setAttribute('points', points + ` ${evt.offsetX},${evt.offsetY}`);
    }
  }
  function updateProps(){
    if(!selectedElement) return;
    selectedElement.setAttribute('fill', propFill.value);
    selectedElement.setAttribute('stroke', propStroke.value);
    selectedElement.setAttribute('stroke-width', propWidth.value);
    widthValue.textContent = propWidth.value;
    saveState();
  }
  // event wiring
  Object.entries(tools).forEach(([k,b])=>b.onclick=()=>activateTool(k));
  undoBtn.onclick = undo;
  redoBtn.onclick = redo;
  clearBtn.onclick = clear;
  saveBtn.onclick = save;
  loadBtn.onclick = load;
  propFill.onchange = updateProps;
  propStroke.onchange = updateProps;
  propWidth.oninput = updateProps;
  svg.onmousedown = startDraw;
  svg.onmouseup = endDraw;
  svg.onmousemove = onMove;
  svg.onclick = selectElement;
  // init
  activateTool('select');
  load();
})();
</script>
