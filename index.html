<style>
:root{
    --primary:#2563eb;
    --secondary:#10b981;
    --bg:#fff;
    --muted:#f9fafb;
    --text:#1f2937;
    --radius:8px;
    --btn-radius:6px;
    --unit:16px;
}
*, *::before, *::after{box-sizing:border-box;}
html{font-size:100%;}
body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f9fafb;
    color:var(--text);
    line-height:1.5;
}
header{
    background:var(--bg);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    padding:calc(var(--unit)*0.5) 0;
}
nav{
    display:flex;
    gap:calc(var(--unit)*0.5);
    overflow-x:auto;
    padding:0 calc(var(--unit)*0.5);
    scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none;}
nav a{
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--muted);
    padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);
    border-radius:var(--btn-radius);
    white-space:nowrap;
    transition:background .2s, color .2s;
}
nav a:hover{
    background:#e0e7ff;
    color:var(--primary);
}
main{
    max-width:1200px;
    margin:0 auto;
    padding:calc(var(--unit)*2);
}
</style>

<main>

<section class='section'>
<h2 class='section-title'>SVG 在线编辑器</h2>
<div class='section-content' style='display:flex;gap:calc(var(--unit)*2);'>
<!-- 工具栏 -->
<div style='display:flex;flex-direction:column;gap:calc(var(--unit)*0.5);width:calc(var(--unit)*6);'>
<button id='btnPen' style='background:var(--primary);color:#fff;border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>笔</button>
<button id='btnLine' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>直线</button>
<button id='btnRect' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>矩形</button>
<button id='btnCircle' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>圆形</button>
<button id='btnText' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>文字</button>
<div style='margin-top:calc(var(--unit)*1);'>
<button id='btnUndo' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>撤销</button>
<button id='btnRedo' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>重做</button>
</div>
</div>

<!-- 画布 -->
<div style='flex:1;position:relative;'>
<svg id='drawing' width='100%' height='100%' viewBox='0 0 800 600' style='background:#fff;border:1px solid var(--muted);display:block;touch-action:none;'></svg>
</div>

<!-- 属性面板 -->
<div style='display:flex;flex-direction:column;gap:calc(var(--unit)*0.5);width:calc(var(--unit)*6);'>
<div>
<label style='font-weight:500;display:block;margin-bottom:calc(var(--unit)*0.25);'>填充色</label>
<input type='color' id='fillColor' value='#ffffff' style='width:100%;padding:calc(var(--unit)*0.25);border-radius:var(--btn-radius);border:1px solid var(--muted);'>
</div>
<div>
<label style='font-weight:500;display:block;margin-bottom:calc(var(--unit)*0.25);'>描边色</label>
<input type='color' id='strokeColor' value='#000000' style='width:100%;padding:calc(var(--unit)*0.25);border-radius:var(--btn-radius);border:1px solid var(--muted);'>
</div>
<div>
<label style='font-weight:500;display:block;margin-bottom:calc(var(--unit)*0.25);'>线宽</label>
<input type='range' id='strokeWidth' min='1' max='20' value='2' style='width:100%;'>
</div>
<div>
<label style='font-weight:500;display:block;margin-bottom:calc(var(--unit)*0.25);'>图层顺序</label>
<div style='display:flex;gap:calc(var(--unit)*0.5);'>
<button id='btnBringForward' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>前移</button>
<button id='btnSendBackward' style='background:var(--muted);color:var(--text);border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;'>后移</button>
</div>
</div>
</div>
</div>
</section>

<script>
// SVG 在线编辑器核心逻辑
const svg = document.getElementById('drawing');
let undoStack = [];
let redoStack = [];
let currentTool = 'pen';
let isDrawing = false;
let startPoint = null;
let currentPath = null;

// 颜色和线宽
const fillColorInput = document.getElementById('fillColor');
const strokeColorInput = document.getElementById('strokeColor');
const strokeWidthInput = document.getElementById('strokeWidth');

// 工具按钮
document.getElementById('btnPen').onclick = () => setTool('pen');
document.getElementById('btnLine').onclick = () => setTool('line');
document.getElementById('btnRect').onclick = () => setTool('rect');
document.getElementById('btnCircle').onclick = () => setTool('circle');
document.getElementById('btnText').onclick = () => setTool('text');
document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnRedo').onclick = redo;
document.getElementById('btnBringForward').onclick = () => changeZIndex(1);
document.getElementById('btnSendBackward').onclick = () => changeZIndex(-1);

function setTool(tool) {
    currentTool = tool;
    // 可视化选中状态（简单实现）
    document.querySelectorAll('#toolbar button').forEach(b => b.style.background = var(--muted));
    if (tool === 'pen') document.getElementById('btnPen').style.background = var(--primary);
    else if (tool === 'line') document.getElementById('btnLine').style.background = var(--primary);
    else if (tool === 'rect') document.getElementById('btnRect').style.background = var(--primary);
    else if (tool === 'circle') document.getElementById('btnCircle').style.background = var(--primary);
    else if (tool === 'text') document.getElementById('btnText').style.background = var(--primary);
}

// 鼠标事件
svg.addEventListener('mousedown', e => {
    isDrawing = true;
    startPoint = {x: e.offsetX, y: e.offsetY};
    if (currentTool === 'pen') {
        currentPath = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        currentPath.setAttribute('fill', 'none');
        currentPath.setAttribute('stroke', strokeColorInput.value);
        currentPath.setAttribute('stroke-width', strokeWidthInput.value);
        currentPath.setAttribute('points', `${startPoint.x},${startPoint.y}`);
        svg.appendChild(currentPath);
    }
});
svg.addEventListener('mousemove', e => {
    if (!isDrawing) return;
    if (currentTool === 'pen' && currentPath) {
        const points = currentPath.getAttribute('points');
        currentPath.setAttribute('points', `${points} ${e.offsetX},${e.offsetY}`);
    } else if (['line','rect','circle'].includes(currentTool)) {
        // 预览临时图形
        let preview = document.getElementById('preview');
        if (!preview) {
            preview = document.createElementNS('http://www.w3.org/2000/svg', currentTool === 'line' ? 'line' : currentTool === 'rect' ? 'rect' : 'circle');
            preview.setAttribute('id', 'preview');
            preview.setAttribute('stroke', strokeColorInput.value);
            preview.setAttribute('stroke-width', strokeWidthInput.value);
            preview.setAttribute('fill', fillColorInput.value === '' ? 'none' : fillColorInput.value);
            svg.appendChild(preview);
        }
        const x = Math.min(startPoint.x, e.offsetX), y = Math.min(startPoint.y, e.offsetY);
        const width = Math.abs(e.offsetX - startPoint.x), height = Math.abs(e.offsetY - startPoint.y);
        if (currentTool === 'line') {
            preview.setAttribute('x1', startPoint.x);
            preview.setAttribute('y1', startPoint.y);
            preview.setAttribute('x2', e.offsetX);
            preview.setAttribute('y2', e.offsetY);
        } else if (currentTool === 'rect') {
            preview.setAttribute('x', x);
            preview.setAttribute('y', y);
            preview.setAttribute('width', width);
            preview.setAttribute('height', height);
        } else if (currentTool === 'circle') {
            const rx = width / 2, ry = height / 2;
            preview.setAttribute('cx', startPoint.x);
            preview.setAttribute('cy', startPoint.y);
            preview.setAttribute('rx', rx);
            preview.setAttribute('ry', ry);
        }
    }
});
svg.addEventListener('mouseup', e => {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentTool === 'pen' && currentPath) {
        // 完成笔画
        pushHistory(currentPath);
        currentPath = null;
    } else if (['line','rect','circle'].includes(currentTool)) {
        const preview = document.getElementById('preview');
        if (preview) {
            const shape = preview.cloneNode(true);
            shape.removeAttribute('id');
            pushHistory(shape);
            preview.remove();
        }
    } else if (currentTool === 'text') {
        const text = prompt('请输入文字内容：');
        if (text !== null && text !== '') {
            const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            textEl.setAttribute('x', e.offsetX);
            textEl.setAttribute('y', e.offsetY);
            textEl.setAttribute('fill', strokeColorInput.value);
            textEl.setAttribute('font-size', `${strokeWidthInput.value*2}px`);
            textEl.textContent = text;
            pushHistory(textEl);
        }
    }
    // 清除预览
    const preview = document.getElementById('preview');
    if (preview) preview.remove();
});

function pushHistory(el) {
    undoStack.push(el);
    redoStack = []; // 新操作清空重做栈
    // 可选：限制栈大小
    if (undoStack.length > 50) undoStack.shift();
}

function undo() {
    if (undoStack.length === 0) return;
    const last = undoStack.pop();
    last.style.display = 'none';
    redoStack.push(last);
}
function redo() {
    if (redoStack.length === 0) return;
    const last = redoStack.pop();
    last.style.display = '';
    undoStack.push(last);
}
function changeZIndex(delta) {
    const selected = document.querySelector('svg *[selected]') || svg.lastElementChild;
    if (!selected) return;
    const current = parseInt(selected.getAttribute('data-z') || '0');
    selected.setAttribute('data-z', current + delta);
    // 简单重新排序
    svg.appendChild(selected);
}

// 缩放平移（鼠标滚轮 + 拖拽）
let scale = 1;
let translateX = 0, translateY = 0;
let isPanning = false;
let panStart = {x:0, y:0};

svg.addEventListener('wheel', e => {
    e.preventDefault();
    const zoom = e.deltaY < 0 ? 1.1 : 0.9;
    scale *= zoom;
    svg.setAttribute('viewBox', `${-translateX/scale} ${-translateY/scale} ${800/scale} ${600/scale}`);
});
svg.addEventListener('mousedown', e => {
    if (e.button === 1) { // 中键平移
        isPanning = true;
        panStart = {x: e.clientX, y: e.clientY};
    }
});
svg.addEventListener('mousemove', e => {
    if (!isPanning) return;
    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;
    panStart = {x: e.clientX, y: e.clientY};
    translateX -= dx;
    translateY -= dy;
    svg.setAttribute('viewBox', `${-translateX/scale} ${-translateY/scale} ${800/scale} ${600/scale}`);
});
svg.addEventListener('mouseup', e => { if (e.button === 1) isPanning = false; });
svg.addEventListener('mouseleave', () => { isPanning = false; });
</script>
