<title>编辑器设置</title>

<style>
:root{
    --primary:#2563eb;
    --secondary:#10b981;
    --bg:#fff;
    --muted:#f9fafb;
    --text:#1f2937;
    --radius:8px;
    --btn-radius:6px;
    --unit:16px;
}
*, *::before, *::after{box-sizing:border-box;}
html{font-size:100%;}
body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f9fafb;
    color:var(--text);
    line-height:1.5;
}
header{
    background:var(--bg);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    padding:calc(var(--unit)*0.5) 0;
}
nav{
    display:flex;
    gap:calc(var(--unit)*0.5);
    overflow-x:auto;
    padding:0 calc(var(--unit)*0.5);
    scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none;}
nav a{
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--muted);
    padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);
    border-radius:var(--btn-radius);
    white-space:nowrap;
    transition:background .2s, color .2s;
}
nav a:hover{
    background:#e0e7ff;
    color:var(--primary);
}
main{
    max-width:1200px;
    margin:0 auto;
    padding:calc(var(--unit)*2);
}
</style>

<section class='section' style='margin-bottom:calc(var(--unit)*2);'><h2 class='section-title' style='margin:0 0 calc(var(--unit)*0.5) 0;font-size:1.25rem;color:var(--text);'>画布尺寸</h2><div class='section-content' style='color:var(--text);line-height:1.6;'><label style='display:block;margin-bottom:calc(var(--unit)*0.5);'>宽度 (px): <input type='number' id='canvas-width' min='100' value='800' style='width:80px;padding:calc(var(--unit)*0.25);'></label><label style='display:block;margin-bottom:calc(var(--unit)*0.5);'>高度 (px): <input type='number' id='canvas-height' min='100' value='600' style='width:80px;padding:calc(var(--unit)*0.25);'></label></div></section>
<section class='section' style='margin-bottom:calc(var(--unit)*2);'><h2 class='section-title' style='margin:0 0 calc(var(--unit)*0.5) 0;font-size:1.25rem;color:var(--text);'>网格显示</h2><div class='section-content' style='color:var(--text);line-height:1.6;'><label style='display:block;'><input type='checkbox' id='grid-toggle'> 显示网格</label></div></section>
<section class='section' style='margin-bottom:calc(var(--unit)*2);'><h2 class='section-title' style='margin:0 0 calc(var(--unit)*0.5) 0;font-size:1.25rem;color:var(--text);'>背景色</h2><div class='section-content' style='color:var(--text);line-height:1.6;'><label style='display:block;'>背景色: <input type='color' id='bg-color' value='#ffffff' style='width:40px;height:24px;padding:0;'></label></div></section>
<section class='section' style='margin-bottom:calc(var(--unit)*2);'><h2 class='section-title' style='margin:0 0 calc(var(--unit)*0.5) 0;font-size:1.25rem;color:var(--text);'>快捷键配置</h2><div class='section-content' style='color:var(--text);line-height:1.6;'><table class='table' style='width:100%;border-collapse:collapse;margin-top:calc(var(--unit)*1);'><thead><tr style='background:var(--muted);'><th style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);text-align:left;font-weight:600;color:var(--text);'>操作</th><th style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);text-align:left;font-weight:600;color:var(--text);'>快捷键</th></tr></thead><tbody><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>撤销</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-undo' placeholder='例如 Ctrl+Z' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>重做</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-redo' placeholder='例如 Ctrl+Y' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>选择工具</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-select' placeholder='例如 V' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>笔工具</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-pen' placeholder='例如 P' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>直线工具</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-line' placeholder='例如 L' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>矩形工具</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-rect' placeholder='例如 R' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>圆形工具</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-circle' placeholder='例如 C' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr><tr><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'>文字工具</td><td style='padding:calc(var(--unit)*0.5) calc(var(--unit)*0.75);border-top:1px solid var(--muted);color:var(--text);'><input type='text' id='shortcut-text' placeholder='例如 T' style='width:100%;padding:calc(var(--unit)*0.25);'></td></tr></tbody></table></div></section>
<button class='btn btn-primary' style='background:var(--primary);color:#fff;border:none;padding:calc(var(--unit)*0.25) calc(var(--unit)*0.5);border-radius:var(--btn-radius);cursor:pointer;font-weight:500;' id='reset-defaults'>重置为默认设置</button>
<script>
(function(){
const STORAGE_KEY = 'svgEditorSettings';
const DEFAULTS = {
canvasWidth: 800,
canvasHeight: 600,
showGrid: true,
bgColor: '#ffffff',
shortcuts: {
undo: 'Ctrl+Z',
redo: 'Ctrl+Y',
select: 'V',
pen: 'P',
line: 'L',
rect: 'R',
circle: 'C',
text: 'T'
}
};
function loadSettings(){
let raw = localStorage.getItem(STORAGE_KEY);
let settings = raw ? JSON.parse(raw) : DEFAULTS;
// populate UI
document.getElementById('canvas-width').value = settings.canvasWidth || DEFAULTS.canvasWidth;
document.getElementById('canvas-height').value = settings.canvasHeight || DEFAULTS.canvasHeight;
document.getElementById('grid-toggle').checked = settings.showGrid !== undefined ? settings.showGrid : DEFAULTS.showGrid;
document.getElementById('bg-color').value = settings.bgColor || DEFAULTS.bgColor;
const sc = settings.shortcuts || DEFAULTS.shortcuts;
document.getElementById('shortcut-undo').value = sc.undo || DEFAULTS.shortcuts.undo;
document.getElementById('shortcut-redo').value = sc.redo || DEFAULTS.shortcuts.redo;
document.getElementById('shortcut-select').value = sc.select || DEFAULTS.shortcuts.select;
document.getElementById('shortcut-pen').value = sc.pen || DEFAULTS.shortcuts.pen;
document.getElementById('shortcut-line').value = sc.line || DEFAULTS.shortcuts.line;
document.getElementById('shortcut-rect').value = sc.rect || DEFAULTS.shortcuts.rect;
document.getElementById('shortcut-circle').value = sc.circle || DEFAULTS.shortcuts.circle;
document.getElementById('shortcut-text').value = sc.text || DEFAULTS.shortcuts.text;
}
function saveSettings(){
const settings = {
canvasWidth: parseInt(document.getElementById('canvas-width').value,10) || DEFAULTS.canvasWidth,
canvasHeight: parseInt(document.getElementById('canvas-height').value,10) || DEFAULTS.canvasHeight,
showGrid: document.getElementById('grid-toggle').checked,
bgColor: document.getElementById('bg-color').value,
shortcuts: {
undo: document.getElementById('shortcut-undo').value.trim() || DEFAULTS.shortcuts.undo,
redo: document.getElementById('shortcut-redo').value.trim() || DEFAULTS.shortcuts.redo,
select: document.getElementById('shortcut-select').value.trim() || DEFAULTS.shortcuts.select,
pen: document.getElementById('shortcut-pen').value.trim() || DEFAULTS.shortcuts.pen,
line: document.getElementById('shortcut-line').value.trim() || DEFAULTS.shortcuts.line,
rect: document.getElementById('shortcut-rect').value.trim() || DEFAULTS.shortcuts.rect,
circle: document.getElementById('shortcut-circle').value.trim() || DEFAULTS.shortcuts.circle,
text: document.getElementById('shortcut-text').value.trim() || DEFAULTS.shortcuts.text
}
};
localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
window.dispatchEvent(new CustomEvent('settings-changed', {detail: settings}));
}
document.getElementById('canvas-width').addEventListener('change', saveSettings);
document.getElementById('canvas-height').addEventListener('change', saveSettings);
document.getElementById('grid-toggle').addEventListener('change', saveSettings);
document.getElementById('bg-color').addEventListener('input', saveSettings);
['shortcut-undo','shortcut-redo','shortcut-select','shortcut-pen','shortcut-line','shortcut-rect','shortcut-circle','shortcut-text'].forEach(id=>{
document.getElementById(id).addEventListener('change', saveSettings);
});
document.getElementById('reset-defaults').addEventListener('click',()=>{
if(confirm('确定要恢复所有设置为默认值吗？')){
localStorage.removeItem(STORAGE_KEY);
loadSettings();
saveSettings();
}
});
// load on page load
loadSettings();
// also listen for storage events from other tabs/windows
window.addEventListener('storage', e=>{
if(e.key === STORAGE_KEY){
try{
const newVal = e.newValue ? JSON.parse(e.newValue) : null;
if(newVal){
 // update UI without triggering save
document.getElementById('canvas-width').value = newVal.canvasWidth || DEFAULTS.canvasWidth;
document.getElementById('canvas-height').value = newVal.canvasHeight || DEFAULTS.canvasHeight;
document.getElementById('grid-toggle').checked = newVal.showGrid !== undefined ? newVal.showGrid : DEFAULTS.showGrid;
document.getElementById('bg-color').value = newVal.bgColor || DEFAULTS.bgColor;
['shortcut-undo','shortcut-redo','shortcut-select','shortcut-pen','shortcut-line','shortcut-rect','shortcut-circle','shortcut-text'].forEach(id=>{
document.getElementById(id).value = newVal.shortcuts ? newVal.shortcuts[id] || DEFAULTS.shortcuts[id] : DEFAULTS.shortcuts[id];
});
}
}catch(_){}
}
});
})();
</script>
